<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connection properties — NerdyRMM Agent</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root { --blue:#1e88e5; --bg:#f4f6f8; --card:#fff; --ink:#1a2332; --muted:#5c6b7a; --line:#e3e8ee; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink);
      font: 13px/1.45 "Segoe UI", Ubuntu, Cantarell, sans-serif; }
    header { display:flex; align-items:center; gap:10px; padding:12px 14px;
      background: linear-gradient(180deg,#1e88e5,#1565c0); color:#fff; }
    header img { width:28px; height:28px; border-radius:6px; background:#fff; }
    header h1 { font-size:14px; margin:0; }
    main { padding:14px; }
    .card { background: var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
    .row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .k { color: var(--muted); min-width: 110px; }
    .v { font-weight: 650; text-align:right; word-break: break-all; }
    .note { color: var(--muted); margin-top: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <img src="/favicon.png" alt="NR">
    <h1>Connection properties</h1>
  </header>
  <main>
    <div class="card" id="rows">Loading…</div>
    <p class="note">The device token is never shown in cleartext. Enrollment secrets are not stored in this dialog. Opened separately from the tray popup so it is not in the hover tooltip.</p>
  </main>
  <script>
    function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    fetch('/api/status').then(r=>r.json()).then(d=>{
      const rows = [
        ['Server URL', d.serverURL || '—'],
        ['Device ID', d.deviceId ? String(d.deviceId) : '—'],
        ['Config path', d.configPath || '—'],
        ['Service', d.service || '—'],
        ['Device token', d.tokenMasked || '••••'],
      ];
      document.getElementById('rows').innerHTML = rows.map(([k,v]) =>
        `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`
      ).join('');
    });
  </script>
</body>
</html>
