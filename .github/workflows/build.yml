name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build all platforms
        run: make build-all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nerdyrmm-agent-binaries
          path: dist/
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SOURCE="tag"
          else
            VERSION=$(sed -nE 's/.*AgentVersion:[[:space:]]*"([^"]+)".*/\1/p' internal/config/config.go | head -n1)
            SOURCE="config"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine release version"
            exit 1
          fi

          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "SOURCE=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Verify config.go matches tag
        if: steps.version.outputs.SOURCE == 'tag'
        run: |
          CFG_VERSION=$(sed -nE 's/.*AgentVersion:[[:space:]]*"([^"]+)".*/\1/p' internal/config/config.go | head -n1)
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          if [ -n "$CFG_VERSION" ] && [ "$CFG_VERSION" != "$TAG_VERSION" ]; then
            echo "::warning::config.go AgentVersion ($CFG_VERSION) does not match tag ($TAG_VERSION)"
          fi

      - name: Check release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
          SOURCE: ${{ steps.version.outputs.SOURCE }}
        run: |
          SHOULD_RELEASE=true
          if [[ "$SOURCE" == "config" ]] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            SHOULD_RELEASE=false
          fi
          echo "SHOULD_RELEASE=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        if: steps.release_state.outputs.SHOULD_RELEASE == 'true'
        run: make build-all
        env:
          VERSION: ${{ steps.version.outputs.TAG }}

      - name: Write agent-version.txt
        if: steps.release_state.outputs.SHOULD_RELEASE == 'true'
        run: echo -n "${{ steps.version.outputs.VERSION }}" > dist/agent-version.txt

      - name: Create GitHub Release
        if: steps.release_state.outputs.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: NerdyAgent ${{ steps.version.outputs.TAG }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
